# Supply-chain policy, checked by `cargo deny check` (CI runs it).
#
# WHY IT MATTERS HERE AND DID NOT BEFORE
#   This repository went public on 2026-08-16 and ships under Apache-2.0
#   (docs/provenance.md). A dependency whose licence is incompatible, or that
#   carries an advisory, is now something distributed rather than something on
#   one machine. `tools/provenance-gate.sh` covers the attributions *we* wrote;
#   this covers the tree we pull in.
#
#   The dependency list was deliberately small — anyhow, serde, serde_json, sha2,
#   cc and their transitive closure — because the whole build is `cargo build`
#   with no network at runtime (README「インストール」).
#
#   **It stopped being small on 2026-08-22**【決定、ユーザー判断】: `math-core`
#   and its closure took the workspace from 30 crates to 48. It was chosen over
#   `pulldown-latex` (one crate) because `pulldown-latex` writes `<mo><</mo>`
#   for `$a < b$` — unescaped markup in 2.9% of Mathlib's math spans 【実測 →
#   benchmarks/results/mathml-2026-08-22.txt】. The whole closure is
#   MIT / Apache-2.0 / Unlicense-OR-MIT, so nothing below moved.
#
#   What this does **not** cover is whether NOTICE names every MIT-only crate
#   that ends up in the binary. `cargo deny` checks the allow list and nothing
#   else; docs/provenance.md §8 carries that as an open verification item.

[graph]
all-features = true

[licenses]
# Everything in the current closure is one of these. A new licence is not
# refused because it is bad — it is refused because nobody has read it yet, and
# the answer is to read it and add it here in a reviewed commit.
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[advisories]
# A yanked release is a decision by its author that we should not be on it.
yanked = "deny"
# Advisories with no fix available still have to be seen and decided about, one
# at a time, with the reason written here. Nothing is ignored today.
ignore = []

[bans]
# Two versions of the same crate is usually harmless and occasionally the sign
# of something worth knowing about, so: report, do not fail.
multiple-versions = "warn"
# A wildcard version is not a dependency, it is a promise to be surprised — but
# this can only be a warning here, and the reason is worth writing down.
#
# The crates of this workspace depend on each other as `{ path = "../…" }` with
# no version, by design: they are one program split across directories
# (implementation-plan §7), released together or not at all. `cargo-deny` has an
# `allow-wildcard-paths` for exactly that, and it **does not apply to crates that
# could be published** — none of ours sets `publish = false`, because whether
# litedoc4 ever goes to crates.io is an open question and answering it in a
# supply-chain config would be the wrong place.
#
# So: warn. A wildcard on an *external* dependency still shows up in the CI log,
# which is what the rule is really for; the four entries about our own crates are
# the workspace's shape rather than a finding.
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
