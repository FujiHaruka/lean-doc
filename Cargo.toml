[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# ------------------------------------------------------------ WHAT MOVES THIS
#
# This is not decoration. It is the token that tells a consumer whether a
# **released binary** can read the IR **this tree's extractor** writes.
#
#   `lakefile.lean`'s `resolveLitedoc4` looks the Rust half up by *this* number
#   — not by the ref the consumer required — and downloads the GitHub Release
#   tagged `v<version>` when one exists. `action.yml` does the same thing with
#   `[ "$REF" = "v$V" ]`. So a checkout whose extractor writes a newer IR while
#   this still names a released version hands that consumer an older binary and
#   a newer IR, and the failure surfaces as a parse error deep inside a build.
#
# SO: **change the IR schema and move this in the same commit.** The IR schema
# is `extractor/Extract.lean`'s `schemaVersion` *and the shape of everything
# under it* — adding a field, or changing `attrs` from a string to a pair, is a
# schema change whether or not the integer moved. Anything else `litedoc4`
# writes that a released binary would have to read back counts too (the ledger,
# `.lidx`).
#
# Not hypothetical: schema 4 → 5 was written with this left at 0.1.4, and
# `tools/lake-download-gate.sh` caught the released v0.1.4 binary refusing a
# schema-5 `attrs` — `invalid type: sequence, expected a string`
# (docs/plans/feature-sweep.md §9).
#
# A version no release carries is the **correct** state for an unreleased
# checkout, not a gap: source 3 finds no asset, says so, and falls through to
# PATH and then `cargo build` — which is the only binary guaranteed to match
# these sources.
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
# Portions are derived from doc-gen4, which is Apache-2.0; NOTICE lists every
# third-party work and docs/provenance.md says which files are affected.
license = "Apache-2.0"
repository = "https://github.com/FujiHaruka/litedoc4"
# None of these crates is a library anyone outside this repository consumes: the
# boundaries exist so that a change to rendering cannot reach into the ledger,
# not so that `litedoc4-render` can be depended on from crates.io. Saying so
# makes `cargo publish` refuse rather than upload six half-crates by accident.
publish = false

# SHA-256 is 20x slower unoptimised, and the ledger's corpus test hashes about
# 4 GB of olean. Only the hash crate is optimised — everything under test stays
# a debug build, so a panic still names a line.
[profile.dev.package.sha2]
opt-level = 3

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# `preserve_order` is not optional: the global artifacts are written from
# explicitly pre-sorted arrays and their bytes depend on insertion order.
# See docs/implementation-plan.md §7.
serde_json = { version = "1", features = ["preserve_order"] }
# LaTeX to MathML, used by `litedoc4-md` only (`src/math.rs`).
#
# WHY THIS ONE AND NOT `pulldown-latex`
#   `docs/plans/feature-sweep.md` 決定 4 named `pulldown-latex`, whose closure is
#   one crate. Measuring it decided otherwise: it escapes `<` and `&` inside
#   `\text{…}` and **nowhere else**, so `$a < b$` — the most ordinary formula
#   there is — comes out as `<mo><</mo>`. 61 of Mathlib's 2,123 math spans
#   (2.9%) carry markup a browser has to guess at 【実測 2026-08-22 →
#   benchmarks/results/mathml-2026-08-22.txt】. `math-core` writes 0.
#
#   It costs eighteen crates (phf, strum, stable-arena and their closure) against
#   `pulldown-latex`'s one, which is the largest single addition this workspace
#   has made. It is taken deliberately: correct markup is not a thing to hand-fix
#   downstream, and a post-escaper over another crate's output is a second place
#   where "is this a tag" gets decided.
#
# `default-features = false` turns off nothing today — the crate's features are
# `serde` and `ariadne`, both off by default — and says so if that changes.
math-core = { version = "0.7.0", default-features = false }
# `litedoc4.toml`, the per-package site configuration (feature-sweep C-3).
#
# `basic-toml` and not `toml`: the latter brings `toml_parser`, `serde_spanned`,
# `toml_datetime` and **two** versions of `winnow`; this one's whole dependency
# is `serde`, which is already here. What it costs is TOML 0.5's surface rather
# than 1.0's — no mixed-type arrays, fewer datetime spellings — and the config
# it parses is two string keys, so the difference is not reachable from it. A
# file that uses something it does not know is a **parse error the build
# reports**, not a value quietly ignored.
basic-toml = "0.1.10"

# ---------------------------------------------------------------------- lints
#
# WHY THESE LIVE HERE AND NOT IN CI
#   `cargo clippy -- -D warnings` in a workflow file is invisible to whoever is
#   editing the code: locally the same lint is a warning that scrolls past, and
#   the first time anyone sees it is a red run. A `[lints]` table is read by
#   every `cargo check`, so the local answer and CI's answer are the same one.
#
# HOW THIS SET WAS CHOSEN
#   Not by turning on a group. `clippy::pedantic` and `clippy::nursery` together
#   report about 1,800 findings here, and the large blocks of that are doc-style
#   lints for crates nobody imports (`missing_errors_doc`, `must_use_candidate`)
#   and taste calls (`option_if_let_else`, `too_many_lines`). Adopting a group
#   and then allowing 400 of its findings would be the "比較器に例外リストを
#   持たせる" failure in CLAUDE.md's own words. What is listed below are the
#   lints where a firing says, in one line, what is broken.
#
#   Each `#[expect]` in the tree carries a reason, and `allow_attributes*` below
#   is what keeps that true.
[workspace.lints.rust]
# The only `unsafe` is md4lean's FFI boundary (litedoc4-md, litedoc4-render).
# Edition 2024 already denies this; naming it means a downgrade to an older
# edition cannot quietly re-open the whole body of an `unsafe fn`.
unsafe_op_in_unsafe_fn = "deny"
# `litedoc4` is a binary: `pub` there is visible to nobody. Writing `pub(crate)`
# instead makes "this is the crate's surface" a true statement in the library
# crates, where it is load-bearing.
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
explicit_outlives_requirements = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
# NOT `missing_debug_implementations`: it fires 16 times here and 12 of those are
# md4c's structs written out in `litedoc4-md/src/ffi.rs`, which are never printed
# as Rust values. Nothing was ever hard to assert against for want of a `Debug`,
# so the lint would be 16 suppressions buying nothing.

[workspace.lints.clippy]
# --- things that panic -------------------------------------------------------
# `Duration - Duration` panics on underflow. Every instance here is a *timing*
# subtraction, so the failure mode is "the build dies while measuring itself".
unchecked_time_subtraction = "deny"
# --- unsafe -----------------------------------------------------------------
# Every `unsafe` block states what the caller guaranteed. This is what keeps
# that a rule rather than a habit.
undocumented_unsafe_blocks = "deny"
# --- numbers ----------------------------------------------------------------
# The product of this repository is numbers, so a silent narrowing is a wrong
# answer rather than a style question. Where a cast is provably in range the
# `#[expect]` says why.
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
cast_precision_loss = "warn"
# --- the filesystem ---------------------------------------------------------
# APFS is case-insensitive by default, so `ends_with(".olean")` and the file the
# OS opened are not the same question.
case_sensitive_file_extension_comparisons = "warn"
# --- work that need not happen ----------------------------------------------
# Speed is the whole claim, and these are the shapes that quietly walk the data
# a second time.
redundant_clone = "warn"
needless_collect = "warn"
format_push_string = "warn"
format_collect = "warn"
implicit_clone = "warn"
# NOT `assigning_clones`: its six findings are all `field = "literal".to_owned()`
# in a test builder, where `"literal".clone_into(&mut field)` trades a reading of
# the line for an allocation nothing is waiting on.
or_fun_call = "warn"
stable_sort_primitive = "warn"
needless_pass_by_value = "warn"
# NOT `trivially_copy_pass_by_ref`: all three of its findings here are `&self` on
# a small `Copy` renderer. Taking `self` by value would make every caller think
# about a move to save an indirection the optimiser already removes.
# --- logic ------------------------------------------------------------------
maybe_infinite_iter = "warn"
match_same_arms = "warn"
# --- shapes that hide a state ------------------------------------------------
option_option = "warn"
use_self = "warn"
semicolon_if_nothing_returned = "warn"
elidable_lifetime_names = "warn"
# NOT `unreadable_literal`: every one of its findings is `0x10FFFF`, the top of
# the Unicode range, in the general-category tables. `0x0010_FFFF` is what the
# lint asks for and is harder to recognise than the spelling the standard uses.
from_iter_instead_of_collect = "warn"
useless_let_if_seq = "warn"
# NOT `unused_self`: all three findings are test builders whose `&'a self` is the
# lifetime the returned options borrow from, so the receiver is load-bearing even
# where the body never reads it.
# --- things that must not reach a commit -------------------------------------
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# `#[expect]` fails when the lint stops firing; `#[allow]` goes stale in silence
# — which is exactly how a suppression outlives the code it was written for.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
