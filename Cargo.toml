[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
# `preserve_order` is not optional: the global artifacts are written from
# explicitly pre-sorted arrays and their bytes depend on insertion order.
# See docs/implementation-plan.md §7.
serde_json = { version = "1", features = ["preserve_order"] }
