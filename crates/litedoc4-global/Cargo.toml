[package]
name = "litedoc4-global"
license.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
litedoc4-ir = { path = "../litedoc4-ir" }
# `escapeHtml` and the Unicode general-category table both live here: the
# docstring renderer needs them too, and a second copy is a second thing that
# has to stay equal. See plan §7 (crate boundary note).
litedoc4-md = { path = "../litedoc4-md" }
# M8-d: the site's four entry pages (index / 404 / search / foundational types)
# are whole-package facts in the renderer's own frame, so this crate builds them
# and takes `head_html` / `topbar_html` / `SiteMeta` / `css_kind` from there
# rather than growing a second copy of the page shape. The dependency only
# points this way — the renderer knows nothing about this crate — so there is no
# cycle. See src/entry.rs for why the pages live on this side.
litedoc4-render = { path = "../litedoc4-render" }
# The state file and the two JSON records are written from these types, and the
# field order of `ModuleFacts` is the state file's bytes: see src/state.rs.
serde = { workspace = true }
# `preserve_order` is set on the workspace dependency and is load-bearing here:
# see src/artifacts.rs.
serde_json = { workspace = true }

[lints]
workspace = true
