# The A/B this repository's central CI claim has never had: documentation built
# in the SAME job as `lake build`, and in a SEPARATE job, on a real runner.
#
# WHAT IS ALREADY MEASURED, AND WHAT IS NOT
#   `docs/approach.md` §3 and §8 used to say a split job costs **8-34x**, citing
#   `importModules` **alone** on a 2-core / 7.75 GiB runner (`ci-import-modules.yml`).
#   This workflow measured the thing a user actually pays — the whole
#   `litedoc4 build` — under both placements, and **that ratio did not reproduce**:
#   **1.08-1.58x** on the 4-core / 15.6 GiB runner, n=5
#   【run 31956756819, 2026-08-16 → docs/verification-log.md】. The mechanism
#   survived; the premise that a split job starts cold did not.
#
# THE THREE ARMS
#   same   cache get -> lake build -> litedoc4 build, one runner, one page cache.
#   split  a fresh runner: cache get (Mathlib's oleans, downloaded and unpacked),
#          the package's own oleans and the extractor **restored as bytes** from
#          the `same` job of the same pair, then litedoc4 build with
#          `--no-lake-build`.
#   cold   the `same` runner again, with `drop_caches` before each build. Not a
#          placement — the **control**. The first run of this A/B came back at
#          **1.06x** 【実測 2026-08-16, run 31955398801, n=1】, and a null result
#          is unreadable without a condition where the instrument is known to
#          show a difference. `cold` is that condition.
#
#   `split` is not a strawman: restoring the build outputs into the docs job is
#   what a split workflow really does, and it is the case `actions/cache` is
#   supposed to cover. The question is whether bytes on disk are worth the same
#   as bytes in the page cache. Both arms run the identical command on the
#   identical oleans — the artifact is produced once, by `same`, and the pairing
#   is per matrix entry, so a pair is one set of bytes measured twice.
#
# WHY A MATRIX AND NOT A LOOP
#   Only the FIRST documentation build in a job is a placement measurement; the
#   ones after it are the warm floor of that runner, because the first one warmed
#   the cache. So n for the placement comes from `pairs` (independent runner
#   pairs), and `reps` only brackets each arm against its own warm floor. Reading
#   run 3 of arm `same` as a third sample of placement is the mistake this
#   comment exists to prevent.
#
# WHY IT IS `workflow_dispatch` ONLY
#   It is a measurement, not a check. On a push it would download several GB per
#   commit.
#
# WHAT MAKES THE RESULT READABLE
#   `benchmarks/tools/check-placement.sh`, run per arm and again over the union:
#   every declared run reported, nothing reported that was not declared, and all
#   arms produced a **byte-identical site**. Placement is supposed to move the
#   clock and not the bytes; two clean builds of this target agree byte for byte
#   【実測 2026-08-17, local】, so a disagreement means the arms did different
#   work and the ratio between them is not a ratio of anything.
name: CI placement A/B (measurement)

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "commit of FujiHaruka/information-theory to measure"
        required: false
        default: "c4f6af29704029b3c62eaa0842c3225ad0e689a0"
      lib:
        description: "the package's lean_lib (its lakefile is Lean code, so it cannot be read)"
        required: false
        default: "InformationTheory"
      pairs:
        description: "runner pairs, as a JSON array — n for the placement comparison"
        required: false
        default: "[1]"
      reps:
        description: "documentation builds per arm; run 1 is the measurement, the rest are that runner's warm floor"
        required: false
        default: "2"

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- arm `same`
  same:
    name: same job (pair ${{ matrix.pair }})
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        pair: ${{ fromJSON(github.event.inputs.pairs || '[1]') }}
    steps:
      - name: Check out litedoc4
        uses: actions/checkout@v5
        with:
          path: litedoc4

      # `crates/litedoc4-render/build.rs` bundles the site's TypeScript into
      # `app.js`, so **cargo cannot build this workspace without node**
      # (`docs/plans/assets-typescript.md` 決定 1). Pinned rather than left to
      # whatever the runner image happens to ship: the version is the one in
      # `mise.toml`, and `tools/assets-gate.sh` checks that these two agree.
      - uses: actions/setup-node@v6
        with:
          node-version: "24.19.0"

      - name: Check out the measurement target (public), pinned
        uses: actions/checkout@v5
        with:
          repository: FujiHaruka/information-theory
          ref: ${{ github.event.inputs.target_ref }}
          path: target

      - name: Record the machine, before anything is downloaded
        run: litedoc4/benchmarks/tools/record-runner.sh env-before.txt target

      - name: Install elan at the target's pinned toolchain
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          ./elan-init -y --default-toolchain "$(cat target/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install the Rust toolchain rust-toolchain.toml asks for
        working-directory: litedoc4
        run: |
          rustup show
          cargo build --release -p litedoc4

      - name: lake exe cache get
        working-directory: target
        run: /usr/bin/time -v lake exe cache get 2>&1 | tail -20

      # Before `lake build`, so that the build is the last thing to touch the
      # page cache before run 1 — the same order `ci-import-modules.yml` uses.
      - name: Build the extractor
        env:
          TARGET_REPO: ${{ github.workspace }}/target
        run: |
          /usr/bin/time -v litedoc4/extractor/build.sh 2>&1 | tail -20
          ls -l litedoc4/extractor/build/extract

      - name: lake build (the placement itself)
        working-directory: target
        run: /usr/bin/time -v lake build 2>&1 | tail -40

      # Measured BEFORE anything else touches the disk. Packing the oleans for
      # the split arm reads 519 MB of exactly the files the import is about, so
      # doing it first would make this arm warmer than the job it stands for.
      - name: Measure
        env:
          ARM: same
          PAIR: ${{ matrix.pair }}
          REPS: ${{ github.event.inputs.reps }}
          LIB: ${{ github.event.inputs.lib }}
        run: litedoc4/benchmarks/tools/run-placement-arm.sh

      # The positive control, on the same runner instance, so it carries no
      # cross-machine confound. If `same` and `split` come out equal, this is
      # what decides between "placement does not matter here" and "this
      # measurement cannot see placement": the import has to be slow with the
      # cache dropped, or nothing else in this run means anything.
      - name: Measure the ceiling (page cache dropped) — the control
        env:
          ARM: cold
          PAIR: ${{ matrix.pair }}
          REPS: "2"
          LIB: ${{ github.event.inputs.lib }}
          DROP: "1"
          APPEND: "1"
        run: litedoc4/benchmarks/tools/run-placement-arm.sh

      # The bytes arm `split` will restore. Only the library outputs: the docs
      # job needs the oleans, not the C intermediates.
      - name: Pack the package's oleans and the extractor for the split arm
        run: |
          tar -C target/.lake/build -cf oleans.tar lib
          cp litedoc4/extractor/build/extract extract-bin
          ls -l oleans.tar extract-bin

      - name: Upload them
        uses: actions/upload-artifact@v4
        with:
          name: build-outputs-${{ matrix.pair }}
          path: |
            oleans.tar
            extract-bin
          retention-days: 1
          compression-level: 1

      - name: Check this arm before anyone reads it
        run: litedoc4/benchmarks/tools/check-placement.sh results

      - name: Upload the raw logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: placement-same-${{ matrix.pair }}
          path: |
            env-before.txt
            results/

  # --------------------------------------------------------------- arm `split`
  split:
    name: split job (pair ${{ matrix.pair }})
    needs: same
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        pair: ${{ fromJSON(github.event.inputs.pairs || '[1]') }}
    steps:
      - name: Check out litedoc4
        uses: actions/checkout@v5
        with:
          path: litedoc4

      # `crates/litedoc4-render/build.rs` bundles the site's TypeScript into
      # `app.js`, so **cargo cannot build this workspace without node**
      # (`docs/plans/assets-typescript.md` 決定 1). Pinned rather than left to
      # whatever the runner image happens to ship: the version is the one in
      # `mise.toml`, and `tools/assets-gate.sh` checks that these two agree.
      - uses: actions/setup-node@v6
        with:
          node-version: "24.19.0"

      - name: Check out the measurement target (public), pinned
        uses: actions/checkout@v5
        with:
          repository: FujiHaruka/information-theory
          ref: ${{ github.event.inputs.target_ref }}
          path: target

      - name: Record the machine, before anything is downloaded
        run: litedoc4/benchmarks/tools/record-runner.sh env-before.txt target

      - name: Install elan at the target's pinned toolchain
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          ./elan-init -y --default-toolchain "$(cat target/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install the Rust toolchain rust-toolchain.toml asks for
        working-directory: litedoc4
        run: |
          rustup show
          cargo build --release -p litedoc4

      # The dependencies' oleans, exactly as the same-job arm got them.
      - name: lake exe cache get
        working-directory: target
        run: /usr/bin/time -v lake exe cache get 2>&1 | tail -20

      # And the package's own build outputs — restored, not rebuilt. This is the
      # step that stands in for `actions/cache` in a split workflow.
      - name: Restore the package's oleans and the extractor
        uses: actions/download-artifact@v4
        with:
          name: build-outputs-${{ matrix.pair }}

      - name: Put them where a build would have left them
        run: |
          mkdir -p target/.lake/build litedoc4/extractor/build
          tar -C target/.lake/build -xf oleans.tar
          install -m 755 extract-bin litedoc4/extractor/build/extract
          find target/.lake/build/lib -name '*.olean' | wc -l

      - name: Measure
        env:
          ARM: split
          PAIR: ${{ matrix.pair }}
          REPS: ${{ github.event.inputs.reps }}
          LIB: ${{ github.event.inputs.lib }}
        run: litedoc4/benchmarks/tools/run-placement-arm.sh

      - name: Check this arm before anyone reads it
        run: litedoc4/benchmarks/tools/check-placement.sh results

      - name: Upload the raw logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: placement-split-${{ matrix.pair }}
          path: |
            env-before.txt
            results/

  # -------------------------------------------------------------------- report
  report:
    name: report
    needs: [same, split]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          path: litedoc4

      - name: Collect every arm's results
        uses: actions/download-artifact@v4
        with:
          pattern: placement-*
          path: arms

      # The union is where the cross-arm claim is checked: the two placements
      # have to have produced the same site, or the ratio is between two
      # different pieces of work.
      - name: Merge and check
        run: |
          mkdir -p results
          : > results/runs.txt
          for d in arms/placement-*/results; do
            [ -d "$d" ] || continue
            cat "$d/runs.txt" >> results/runs.txt
            # Every file the checker and the summary read: the run log carries
            # the import time, so leaving it behind would make the union check
            # fail on runs that did report one.
            cp "$d"/timings-*.json "$d"/site-*.sha256 "$d"/time-*.txt results/ 2>/dev/null || true
            cp "$d"/litedoc4-*.json results/ 2>/dev/null || true
          done
          sort -o results/runs.txt results/runs.txt
          litedoc4/benchmarks/tools/check-placement.sh results

      - name: Summarise
        if: always()
        run: litedoc4/benchmarks/tools/summarize-placement.sh results arms | tee results/placement-summary.txt

      - name: Upload the summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: placement-summary
          path: results/
