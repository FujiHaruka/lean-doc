# Does `require «lean-doc»` actually work?  (docs/plans/lake-package.md, L1-e)
#
# ============================================================================
# WHY THIS IS NOT PART OF ci.yml
# ============================================================================
#   Same reason ci-action.yml is separate: ci.yml answers "is the code green".
#   This answers "is the distribution channel green". The lakefile can be broken
#   while every test passes — a script Lake never registers, a `--lib` lookup
#   that reads the wrong field, an extractor target that does not build.
#   `cargo test` sees none of it, and neither does `cargo clippy`: no Rust is
#   involved in any of it.
#
# ============================================================================
# THE THREE JOBS, AND WHY EACH IS SEPARATE
# ============================================================================
#   gate         `tools/lake-package-gate.sh` on Linux. The same five items the
#                gate runs locally, on the OS the probe never measured — every
#                number in benchmarks/results/lake-package-probe-2026-08-18.txt
#                is macOS/arm64, and `leanc`'s defaults differ per platform.
#                This uses a **path** require, which is not the real channel.
#   git-require  the real channel: a generated consumer that says
#                `require «lean-doc» from git … @ "<this commit>"`, so Lake
#                clones this repository over the network into
#                `.lake/packages/lean-doc` exactly as a user's would.
#
#                Unlike ci-action.yml's `published` job — which has to say
#                `@main` because `uses:` cannot take an expression — this one
#                pins **this commit**, because the require line is generated by
#                a script. So it tests this diff, not just the channel.
#
#                Skipped only for **fork** pull requests: their head commit is
#                not in this repository, so `@ <sha>` could not resolve, and a
#                job that quietly cloned `main` instead would report on code
#                that is not under review. A same-repo PR pins its head commit,
#                which is what lets a new lakefile be exercised before it
#                reaches main (CLAUDE.md「main を赤くせずに取る」).
#   refused      a consumer with no `lean_lib` FAILS with a named error. A gate
#                that cannot fail is not a gate (CLAUDE.md; this repository has
#                shipped two of those).
#
#   The consumers are generated here rather than committed: `e2e/consumer/`
#   requires by path and is the local fixture, and a second committed copy that
#   differs only in its require line would drift from it silently.
name: lake package (self-test)

on:
  push:
    branches: [main]
    paths:
      - "lakefile.lean"
      - "lake-manifest.json"
      - "extractor/**"
      - "e2e/consumer/**"
      - "tools/lake-package-gate.sh"
      - ".github/workflows/ci-lake.yml"
  pull_request:
    paths:
      - "lakefile.lean"
      - "lake-manifest.json"
      - "extractor/**"
      - "e2e/consumer/**"
      - "tools/lake-package-gate.sh"
      - ".github/workflows/ci-lake.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  gate:
    name: the five gate items, on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Cache elan
        id: elan-cache
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('e2e/micro/lean-toolchain') }}

      - name: Install elan at the fixture's toolchain
        if: steps.elan-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          ./elan-init -y --default-toolchain "$(cat e2e/micro/lean-toolchain)"

      - name: Put elan on PATH
        run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2

      - name: Build lean-doc
        run: cargo build --bin lean-doc

      - name: Gate
        run: tools/lake-package-gate.sh

  git-require:
    name: a consumer requires this commit over the network
    # A fork PR's head commit is not in this repository, so `@ <sha>` could not
    # be resolved; cloning `main` instead would report on code nobody proposed.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # The commit the generated consumer pins. For a pull_request the head
      # commit, not `github.sha` (which is the *merge* commit: it exists only
      # under refs/pull/N/merge, and Lake's clone would not have it).
      REQUIRE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5

      - name: Cache elan
        id: elan-cache
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('e2e/micro/lean-toolchain') }}

      - name: Install elan at the fixture's toolchain
        if: steps.elan-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          ./elan-init -y --default-toolchain "$(cat e2e/micro/lean-toolchain)"

      - name: Put elan on PATH
        run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2

      - name: Build lean-doc
        run: cargo build --bin lean-doc

      # Written outside the checkout so that nothing here can accidentally
      # resolve to the working tree instead of the clone Lake makes.
      - name: Generate a consumer that requires this commit
        run: |
          set -euo pipefail
          CONSUMER="$RUNNER_TEMP/consumer"
          mkdir -p "$CONSUMER/Widget"
          cp e2e/micro/lean-toolchain "$CONSUMER/lean-toolchain"
          cat > "$CONSUMER/lakefile.lean" <<LAKEFILE
          import Lake
          open Lake DSL

          require «lean-doc» from git
            "https://github.com/FujiHaruka/lean-doc" @ "$REQUIRE_SHA"

          package widget

          lean_lib Widget
          LAKEFILE
          cat > "$CONSUMER/Widget.lean" <<'LEAN'
          import Widget.Basic
          LEAN
          cat > "$CONSUMER/Widget/Basic.lean" <<'LEAN'
          /-- The answer. -/
          def widgetAnswer : Nat := 42

          /-- It is the answer. -/
          theorem widgetAnswer_eq : widgetAnswer = 42 := rfl
          LEAN
          echo "CONSUMER=$CONSUMER" >> "$GITHUB_ENV"

      # The real channel: this clones over https into .lake/packages/lean-doc.
      - name: lake update, then build the consumer
        working-directory: ${{ env.CONSUMER }}
        run: |
          set -euo pipefail
          lake update
          test -d .lake/packages/lean-doc \
            || { echo "::error::lake did not check lean-doc out into .lake/packages"; exit 1; }
          # The clone has to be *this* commit, not whatever main happens to be.
          GOT="$(git -C .lake/packages/lean-doc rev-parse HEAD)"
          [ "$GOT" = "$REQUIRE_SHA" ] \
            || { echo "::error::cloned $GOT, wanted $REQUIRE_SHA"; exit 1; }
          lake build

      - name: lake run docs
        working-directory: ${{ env.CONSUMER }}
        env:
          LEAN_DOC_BIN: ${{ github.workspace }}/target/debug/lean-doc
        run: |
          set -euo pipefail
          lake run docs -- --out "$RUNNER_TEMP/widget-docs" | tee "$RUNNER_TEMP/docs.log"
          # `lake run` reports the script's exit code, but a script that exits 0
          # without writing anything is the failure this repository keeps
          # catching. Ask the filesystem.
          test -f "$RUNNER_TEMP/widget-docs/site/index.html" \
            || { echo "::error::no site was written"; exit 1; }
          # And that --lib really came from Lake: nothing above passed one.
          test -f "$RUNNER_TEMP/widget-docs/site/Widget/Basic.html" \
            || { echo "::error::Widget.Basic has no page — the --lib lookup missed it"; exit 1; }
          grep -q -- "--lib Widget" "$RUNNER_TEMP/docs.log" \
            || { echo "::error::the script did not derive --lib Widget"; exit 1; }

      - name: The site closes over itself
        run: tools/site-gate.sh "$RUNNER_TEMP/widget-docs/site"

  refused:
    name: a consumer with no lean_lib fails
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Cache elan
        id: elan-cache
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('e2e/micro/lean-toolchain') }}

      - name: Install elan at the fixture's toolchain
        if: steps.elan-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          ./elan-init -y --default-toolchain "$(cat e2e/micro/lean-toolchain)"

      - name: Put elan on PATH
        run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2

      - name: Build lean-doc
        run: cargo build --bin lean-doc

      - name: A package with no lean_lib is refused, by name
        run: |
          set -euo pipefail
          CONSUMER="$RUNNER_TEMP/empty"
          mkdir -p "$CONSUMER"
          cp e2e/micro/lean-toolchain "$CONSUMER/lean-toolchain"
          cat > "$CONSUMER/lakefile.lean" <<LAKEFILE
          import Lake
          open Lake DSL

          require «lean-doc» from "${{ github.workspace }}"

          package empty
          LAKEFILE
          cd "$CONSUMER"
          lake update
          set +e
          LEAN_DOC_BIN="${{ github.workspace }}/target/debug/lean-doc" \
            lake run docs -- --out "$RUNNER_TEMP/empty-docs" >out.log 2>&1
          CODE=$?
          set -e
          cat out.log
          # Not just "non-zero": the exit code names *which* refusal, and the
          # message has to say what was missing. A package that failed to build
          # would also be non-zero and would prove nothing.
          [ "$CODE" -eq 3 ] \
            || { echo "::error::expected exit 3 (no lean_lib), got $CODE"; exit 1; }
          grep -q "declares no .lean_lib" out.log \
            || { echo "::error::exit 3 but the message does not name the reason"; exit 1; }
          test ! -e "$RUNNER_TEMP/empty-docs" \
            || { echo "::error::it refused and still created --out"; exit 1; }
