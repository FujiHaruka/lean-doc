# Runs the workflow template — `.github/workflow-templates/litedoc4-docs.yml` —
# so that its header stops saying it has never been run.
#
# WHAT THE TEMPLATE'S HEADER SAYS IS UNVERIFIED, AND WHAT THIS COVERS
#   "the actions' versions and inputs, the cache keys, the elan install, and
#   `lake exe cache get` (which needs the network)". Every one of those is below,
#   copied from the template rather than rewritten, so a run of this workflow is
#   evidence about that file and not about a paraphrase of it.
#
# THE FOUR DIFFERENCES, AND WHY EACH IS FORCED
#   1. `on:` is `workflow_dispatch` only. The template also runs on push, which
#      here would download several GB per commit of a repository that is not a
#      Lean package.
#   2. The package is **generated, not checked out**. litedoc4 has no Lean
#      package of its own and creating one outside this repository was ruled out,
#      so `tools/make-target2.sh` builds the second target in the job. It is the
#      right package for this: its `lakefile.toml` declares **two**
#      `[[lean_lib]]` blocks, which is what `litedoc4 build` has to read to
#      derive `--lib` — the step the template depends on and never states.
#   3. elan is installed **before** the package exists, from the measurement
#      target's `lean-toolchain` — the same bytes `make-target2.sh` then copies
#      into the package. The template installs it from `package/lean-toolchain`;
#      generating the package needs `lake` first, so the order is inverted and
#      the file read is the same one.
#   4. The site is not uploaded. The template's last step is an
#      `upload-artifact` of a directory, which is not in doubt.
#
#   Everything else — `actions/checkout@v4`, the four `actions/cache@v4` blocks
#   and their keys, the elan install line, and the single `ci-build.sh` call with
#   its four flags — is the template's, verbatim.
#
# WHAT A GREEN RUN HERE DOES NOT PROVE
#   That the template works **in a user's repository**: there, `package` is the
#   caller's own checkout and the workflow triggers on push. Both are ordinary
#   GitHub mechanics, and neither is what the header called into question.
name: template (validation)

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "commit of FujiHaruka/information-theory whose toolchain and manifest the package copies"
        required: false
        default: "c4f6af29704029b3c62eaa0842c3225ad0e689a0"

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # litedoc4 itself — the template's second checkout, with no token, which
      # is the line the public repository made possible.
      - name: check out litedoc4
        uses: actions/checkout@v4
        with:
          repository: FujiHaruka/litedoc4
          path: litedoc4

      # Difference 2/3: the package does not exist yet, so what is checked out
      # here is only the source of its `lean-toolchain` and `lake-manifest.json`.
      - name: check out the measurement target (for its pinned toolchain and manifest)
        uses: actions/checkout@v4
        with:
          repository: FujiHaruka/information-theory
          ref: ${{ github.event.inputs.target_ref }}
          path: target-src

      # The template's elan step, reading the same `lean-toolchain` the package
      # will carry.
      - name: install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: record the machine
        run: litedoc4/benchmarks/tools/record-runner.sh env-before.txt target-src

      # `--deps fetch` is the path this script has never taken: on a runner there
      # is no measurement target to clone `.lake/packages` from with APFS
      # clonefile, so Lake fetches the revisions the copied manifest pins and
      # `lake exe cache get` downloads Mathlib's oleans.
      - name: generate the package
        env:
          TARGET_SRC: ${{ github.workspace }}/target-src
        run: |
          litedoc4/tools/make-target2.sh --out "$GITHUB_WORKSPACE/package" --deps fetch
          cat package/lakefile.toml

      - name: cache Mathlib's oleans
        uses: actions/cache@v4
        with:
          path: ~/.cache/mathlib
          key: mathlib-${{ hashFiles('package/lake-manifest.json') }}

      - name: cache the Lean extractor
        uses: actions/cache@v4
        with:
          path: litedoc4/extractor/build
          key: >-
            extractor-${{ hashFiles('package/lean-toolchain',
            'litedoc4/extractor/Extract.lean') }}

      - name: cache the Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            litedoc4/target
          key: cargo-${{ runner.os }}-${{ hashFiles('litedoc4/Cargo.lock') }}

      # The template's fourth cache. `id:` is the one addition — the run has to
      # be able to say whether it restored anything, because "extract was fast"
      # and "extract was skipped" are different claims and a timing alone cannot
      # tell them apart.
      - name: cache the documentation state (IR + ledger + site)
        id: docs-cache
        uses: actions/cache@v4
        with:
          path: docs-out
          key: litedoc4-docs-${{ github.sha }}
          restore-keys: |
            litedoc4-docs-

      # The template's one step, verbatim except for `tee`: the counts that say
      # how many modules were re-extracted are on stdout, and this is a
      # measurement run.
      - name: build the package and its documentation
        run: |
          set -o pipefail
          litedoc4/tools/ci-build.sh \
            --root package \
            --out "$GITHUB_WORKSPACE/docs-out" \
            --cache-get \
            --jobs 4 2>&1 | tee build-log.txt

      # Not the template's, and the reason this workflow is worth more than
      # "does the template still run".
      #
      # The package above is generated deterministically, so **every run after
      # the first is a no-change run** — `extract 0 / render 0 / requests 0`,
      # `incremental in 0.0164 s`【実測 2026-08-17, run 31962696064】. That is the
      # cheap half of the incremental claim and it was the only half a Linux
      # runner had ever exercised. What 段 C and 段 D buy is the cost of a
      # **one-module edit**, and until this step existed that number came only
      # from one laptop (`docs/plans/reextract-count.md` §6).
      #
      # Into a *copy* of the state, not into `docs-out` itself: `docs-out` is
      # what the cache saves at the end of the job, and it has to keep describing
      # the package as generated. Building the edit in place would leave the next
      # run restoring a state whose IR carries a declaration the regenerated
      # sources do not have, which silently turns the no-change measurement above
      # into a second one-module measurement.
      # **Two edits, and the gate reads the second.** The restored state may have
      # been written by a litedoc4 from before 段 C — the cache's `restore-keys`
      # match on a prefix, so it usually was. Such a map still carries the
      # package's own declaration groups and has no `.key` sidecar, so the first
      # edit's build rewrites it into the current shape, its digest moves, and
      # every page re-renders. **That is a real cost and it is not a bug**: it is
      # what upgrading litedoc4 across 段 C costs, once, on a state built before
      # it【実測 2026-08-17, run 31963079828, where this step first ran and
      # failed exactly here】. It is also not what this gate asks. So the first
      # round takes the state to its steady shape and the second is the one
      # measured; both logs are kept so the transition stays visible.
      - name: edit one module and build again
        run: |
          set -o pipefail
          cp -a docs-out docs-out-onemod
          for round in 1 2; do
            printf '\n/-- Probe %s, appended by the one-module gate. -/\ndef ciOneModProbe%s_ : Nat := 13\n' \
              "$round" "$round" >> package/Alpha/Basic.lean
            litedoc4/tools/ci-build.sh \
              --root package \
              --out "$GITHUB_WORKSPACE/docs-out-onemod" \
              --jobs 4 2>&1 | tee "onemod-log-$round.txt"
          done
          litedoc4/tools/onemod-gate.sh \
            docs-out-onemod/litedoc4-build.json \
            docs-out-onemod/work/serve.out

      # Not the template's: what makes the run readable afterwards. The template
      # ends by uploading `<out>/site`, which this repeats with the timings and
      # the machine beside it.
      - name: what the run produced
        if: always()
        run: |
          {
            echo "## documentation-state cache"
            echo "cache-hit    ${{ steps.docs-cache.outputs.cache-hit }}"
            echo "matched-key  ${{ steps.docs-cache.outputs.cache-matched-key }}"
            echo
            echo "## what the build said (the module counts are here)"
            cat build-log.txt 2> /dev/null || echo "(none)"
            echo
            echo "## ci-build.sh timings"
            cat docs-out/ci-timings.json 2> /dev/null || echo "(none)"
            echo
            echo "## litedoc4 build timings"
            cat docs-out/litedoc4-timings.json 2> /dev/null || echo "(none)"
            echo
            echo "## the format transition, if the restored state predates 段 C"
            cat onemod-log-1.txt 2> /dev/null || echo "(none)"
            echo
            echo "## what a one-module edit cost in the steady state (段 C / 段 D)"
            cat onemod-log-2.txt 2> /dev/null || echo "(none)"
            echo
            echo "## litedoc4 build timings — the one-module run"
            cat docs-out-onemod/litedoc4-timings.json 2> /dev/null || echo "(none)"
            echo
            echo "## the extractor's own log — the one-module run"
            cat docs-out-onemod/work/serve.out 2> /dev/null || echo "(none)"
            echo
            echo "## site"
            find docs-out/site -type f 2> /dev/null | wc -l
            (cd docs-out/site && find . -type f | sort | xargs sha256sum | sha256sum) \
              2> /dev/null || true
            echo
            echo "## conditions"
            cat env-before.txt
          } | tee template-run.txt

      - name: upload the site and the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: template-validation
          path: |
            template-run.txt
            env-before.txt
            docs-out/site
            docs-out/ci-timings.json
            docs-out/litedoc4-timings.json
            onemod-log-1.txt
            onemod-log-2.txt
            docs-out-onemod/ci-timings.json
            docs-out-onemod/litedoc4-timings.json
            docs-out-onemod/work/serve.out
