# Does `uses: FujiHaruka/litedoc4@…` actually work?  (docs/plans/distribution.md, D3)
#
# ============================================================================
# WHY THIS IS NOT PART OF ci.yml
# ============================================================================
#   ci.yml answers "is the code green". This answers "is the distribution
#   channel green", which is a different thing and fails differently: the action
#   can be broken while every test passes — a bad cache key, a `hashFiles()`
#   that cannot see outside the workspace, an input that never reaches the
#   script. None of that is visible to `cargo test`.
#
# ============================================================================
# THE FIVE THINGS CHECKED, AND WHY EACH IS SEPARATE
# ============================================================================
#   local        the action runs, produces a site, and reports its path
#   incremental  running it twice re-renders nothing (the reason to cache state)
#   standalone   it installs elan itself when `lake` is not already there
#   refused      a package that does not exist FAILS. A gate that cannot fail is
#                not a gate — CLAUDE.md, and this repository has shipped two of
#                those before
#   published    `uses: FujiHaruka/litedoc4@main` goes through the real path
#                (GitHub checks the action out into _actions/), which `uses: ./`
#                never exercises. It is @main and not this commit because
#                `uses:` cannot take an expression — so it tests the channel,
#                not this diff.
#   released     the release-download path, which none of the above ever takes
#                (@main has no release, so they all fall back to cargo).
#                workflow_dispatch only; it pins a tag, so it goes stale by
#                design.
#
#   The fixture stands in for a user's package: e2e/micro depends on Lean core
#   only, so this costs an elan download and seconds of Lean, not Mathlib.
name: action (self-test)

on:
  push:
    branches: [main]
    paths:
      - "action.yml"
      - "tools/ci-build.sh"
      - ".github/workflows/ci-action.yml"
  pull_request:
    paths:
      - "action.yml"
      - "tools/ci-build.sh"
      - ".github/workflows/ci-action.yml"
  workflow_dispatch:

concurrency:
  # One run per workflow per ref. Without this a burst of pushes leaves the
  # earlier runs going: they cannot say anything about HEAD any more, but they
  # still hold slots against the 20-job concurrency limit.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental compilation is for a working tree that gets built over and
  # over. CI builds once from a restored cache and throws the machine away, so
  # the incremental state is never read back — it is only written, cached, and
  # restored. Locally it was 3.5 GB of a 7.2 GB `target/`, and the cargo cache
  # is what was pushing this repository to 98.8% of the 10 GiB limit.
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  local:
    name: the action builds a site, twice
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      # elan up front so the toolchain download is cached across runs. The
      # action would install it itself (install-elan); the `standalone` job
      # below is where that path is exercised.
      - name: Cache elan
        id: elan-cache
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('e2e/micro/lean-toolchain') }}

      - name: Install elan at the fixture's toolchain
        if: steps.elan-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          ./elan-init -y --default-toolchain "$(cat e2e/micro/lean-toolchain)"

      - name: Put elan on PATH
        run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # `full: true` so this job does not depend on what the state cache happens
      # to hold. Without it the first call can legitimately render 0 pages —
      # a previous run's state gets restored and there is nothing left to do —
      # and then "the first run rendered nothing" is a property of the cache,
      # not of the action. Measured: that is exactly how this check first failed.
      # It also skips the state restore, so the pair below is first=everything,
      # second=nothing, every time.
      - id: docs
        uses: ./
        with:
          root: e2e/micro
          jobs: "2"
          full: "true"

      - name: The outputs point at something real
        run: |
          set -euo pipefail
          SITE="${{ steps.docs.outputs.site }}"
          echo "site = $SITE"
          test -d "$SITE" || { echo "::error::outputs.site is not a directory"; exit 1; }
          test -f "$SITE/index.html" || { echo "::error::no index.html"; exit 1; }
          echo "pages: $(find "$SITE" -name '*.html' | wc -l)"
          cat "${{ steps.docs.outputs.timings }}"
          # A first run that renders nothing would satisfy every check below,
          # so it is asserted here rather than assumed.
          python3 - "${{ steps.docs.outputs.out }}/litedoc4-build.json" <<'PY'
          import json, sys
          w = json.load(open(sys.argv[1]))["work"]
          if not w.get("pagesRendered"):
              print(f"::error::the first run rendered no pages: {w}")
              sys.exit(1)
          print(f"first run rendered {w['pagesRendered']} pages")
          PY

      # The second run is the claim the whole tool is built on. Same inputs,
      # same --out: nothing should be re-rendered.
      - id: again
        uses: ./
        with:
          root: e2e/micro
          jobs: "2"

      # `work` in litedoc4-build.json is the product's own count of what it did,
      # and it is integers rather than seconds — the thing CLAUDE.md says to
      # gate on, because wall clock moves 5x with the page cache.
      - name: The second run did no work
        run: |
          set -euo pipefail
          J="${{ steps.again.outputs.out }}/litedoc4-build.json"
          cat "$J"
          python3 - "$J" <<'PY'
          import json, sys
          w = json.load(open(sys.argv[1]))["work"]
          bad = {k: w.get(k) for k in ("modulesExtracted", "pagesRendered") if w.get(k, -1) != 0}
          if bad:
              print("::error::a rebuild with nothing changed did work: " +
                    ", ".join(f"{k}={v}" for k, v in bad.items()))
              sys.exit(1)
          print("no-op rebuild: extracted 0, rendered 0")
          PY

  standalone:
    name: the action installs elan itself
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Nothing in ~/.elan to start with
        run: test ! -d "$HOME/.elan" && echo "clean"
      - id: docs
        uses: ./
        with:
          root: e2e/micro
          jobs: "2"
      - run: test -f "${{ steps.docs.outputs.site }}/index.html"

  refused:
    name: a package that does not exist fails
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - id: attempt
        continue-on-error: true
        uses: ./
        with:
          root: this-package-does-not-exist
      - name: It must have failed
        run: |
          if [ "${{ steps.attempt.outcome }}" != "failure" ]; then
            echo "::error::the action accepted a package that is not there"
            exit 1
          fi
          echo "refused, as it should"

  published:
    name: uses:FujiHaruka/litedoc4@main (the real checkout path)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Only from this repository's own branches: a fork's PR would resolve @main
    # to this repository anyway, which tells the fork nothing.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v5

      - name: Cache elan
        id: elan-cache
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('e2e/micro/lean-toolchain') }}

      - name: Install elan at the fixture's toolchain
        if: steps.elan-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          ./elan-init -y --default-toolchain "$(cat e2e/micro/lean-toolchain)"

      - name: Put elan on PATH
        run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - id: docs
        uses: FujiHaruka/litedoc4@main
        with:
          root: e2e/micro
          jobs: "2"

      - run: test -f "${{ steps.docs.outputs.site }}/index.html"

  # The one path the jobs above never take: `@main` has no release, so they all
  # fall back to cargo. This pins a tag so the download actually happens, and
  # asserts on `binary-source` rather than on the log — "it worked" is not
  # evidence that it worked *that way*.
  #
  # On demand only, and the pin goes stale by design: re-run it (and move the
  # pin, and README's) when a release is cut.
  released:
    name: uses:@v0.1.4 — the released binary, not a cargo build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5

      # `crates/litedoc4-render/build.rs` bundles the site's TypeScript into
      # `app.js`, so **cargo cannot build this workspace without node**
      # (`docs/plans/assets-typescript.md` 決定 1). Pinned rather than left to
      # whatever the runner image happens to ship: the version is the one in
      # `mise.toml`, and `tools/assets-gate.sh` checks that these two agree.
      - uses: actions/setup-node@v6
        with:
          node-version: "24.19.0"

      - name: Cache elan
        id: elan-cache
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('e2e/micro/lean-toolchain') }}

      - name: Install elan at the fixture's toolchain
        if: steps.elan-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          ./elan-init -y --default-toolchain "$(cat e2e/micro/lean-toolchain)"

      - name: Put elan on PATH
        run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - id: docs
        uses: FujiHaruka/litedoc4@v0.1.4
        with:
          root: e2e/micro
          jobs: "2"

      - name: It came from the release
        run: |
          SRC="${{ steps.docs.outputs.binary-source }}"
          echo "binary-source = $SRC"
          test "$SRC" = "release" || {
            echo "::error::expected the released binary, got '$SRC' — the download path did not run"
            exit 1; }
          test -f "${{ steps.docs.outputs.site }}/index.html"
