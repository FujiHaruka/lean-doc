# Can a prebuilt Lean extractor be shipped?  (docs/plans/distribution.md, D1)
#
# Three questions, one per job, none of which can be answered on the machine
# this was written on:
#
#   X3  uniqueness  — on Linux, is `extract` decided by the toolchain alone?
#                     (macOS says yes: 4 builds, 0 to 15 dependency packages,
#                     one SHA-256 — benchmarks/results/extractor-uniqueness-
#                     2026-08-18.txt. Linux may link differently.)
#   X4  portable    — does a binary built in one job still work in another job,
#                     on another runner, reached only through an artifact?
#   X5  mismatch    — run against a toolchain it was NOT built for, does it fail
#                     loudly or write a wrong IR quietly?
#
# `workflow_dispatch` only: this is a measurement, not a gate, and it costs an
# elan download per job. CLAUDE.md's rule for taking CI numbers without turning
# main red.
#
# The commands live in tools/extractor-uniqueness.sh and tools/extractor-
# mismatch.sh, which run on a laptop too. What is only here is the part that
# genuinely needs Actions: handing a binary from one runner to another.
name: extractor portability (X3/X4/X5)

on:
  workflow_dispatch:
    inputs:
      other-toolchain:
        description: "toolchain for the X5 mismatch job (must differ from e2e/micro's)"
        default: "leanprover/lean4:v4.30.0"
        required: true

concurrency:
  # `cancel-in-progress: false`: a double dispatch queues instead of killing the
  # run already measuring. Losing a 40-minute measurement to a stray click is
  # worse than waiting for it.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Incremental compilation is for a working tree that gets built over and
  # over. CI builds once from a restored cache and throws the machine away, so
  # the incremental state is never read back — it is only written, cached, and
  # restored. Locally it was 3.5 GB of a 7.2 GB `target/`, and the cargo cache
  # is what was pushing this repository to 98.8% of the 10 GiB limit.
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  # ------------------------------------------------------------------- X3
  uniqueness:
    name: X3 — one toolchain, different dependency sets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Cache elan
        id: elan-cache
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('e2e/micro/lean-toolchain') }}

      - name: Install elan at the fixture's toolchain
        if: steps.elan-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          ./elan-init -y --default-toolchain "$(cat e2e/micro/lean-toolchain)"

      - name: Put elan on PATH
        run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Two packages that are not copies of each other: one with no dependency
      # packages at all, one with a path dependency. Mathlib is not available
      # here (several GB) — that end of the range is covered on the laptop.
      - name: Build the extractor once per package and compare
        run: |
          tools/extractor-uniqueness.sh \
            e2e/micro e2e/micro-dep \
            --keep-binary "$RUNNER_TEMP/extract" \
            --json "$RUNNER_TEMP/uniqueness.json"

      - name: Upload the extractor for the other jobs
        uses: actions/upload-artifact@v4
        with:
          name: extract-linux-x86_64
          path: ${{ runner.temp }}/extract
          retention-days: 1

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uniqueness-json
          path: ${{ runner.temp }}/uniqueness.json
          if-no-files-found: warn

  # ------------------------------------------------------------------- X4
  #
  # The question is not "does the file survive a round trip" but "does a binary
  # that never met this runner produce a site here". So it runs the whole e2e,
  # not a --version check: e2e-micro.sh builds the fixture, generates, and
  # checks one command / idempotence / determinism.
  portable:
    name: X4 — same binary, another runner
    needs: uniqueness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # `crates/litedoc4-render/build.rs` bundles the site's TypeScript into
      # `app.js`, so **cargo cannot build this workspace without node**
      # (`docs/plans/assets-typescript.md` 決定 1). Pinned rather than left to
      # whatever the runner image happens to ship: the version is the one in
      # `mise.toml`, and `tools/assets-gate.sh` checks that these two agree.
      - uses: actions/setup-node@v6
        with:
          node-version: "24.19.0"

      - name: Install the toolchain rust-toolchain.toml asks for
        run: rustup show

      # Keyed per job and without `restore-keys` — see the long note in ci.yml.
      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-v2-${{ runner.os }}-portability-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}

      - name: Cache elan
        id: elan-cache
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('e2e/micro/lean-toolchain') }}

      - name: Install elan at the fixture's toolchain
        if: steps.elan-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          ./elan-init -y --default-toolchain "$(cat e2e/micro/lean-toolchain)"

      - name: Put elan on PATH
        run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@v4
        with:
          name: extract-linux-x86_64
          path: ${{ runner.temp }}/downloaded

      # The permission bit does not survive an artifact round trip. That is a
      # fact about the distribution channel, so it is stated here rather than
      # hidden: a release tarball keeps the bit, a bare artifact does not.
      - name: Make it executable again, and say what it links against
        run: |
          chmod +x "$RUNNER_TEMP/downloaded/extract"
          ls -l "$RUNNER_TEMP/downloaded/extract"
          ldd "$RUNNER_TEMP/downloaded/extract" || true
          sha256sum "$RUNNER_TEMP/downloaded/extract"

      - name: Build the CLI
        run: cargo build --bin litedoc4

      - name: End to end, with a binary this runner never built
        run: |
          tools/e2e-micro.sh \
            --extractor "$RUNNER_TEMP/downloaded/extract" \
            --out "$RUNNER_TEMP/e2e" --keep

  # ------------------------------------------------------------------- X5
  mismatch:
    name: X5 — wrong toolchain, loud or quiet?
    needs: uniqueness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install elan with BOTH toolchains
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          ./elan-init -y --default-toolchain "$(cat e2e/micro/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "${{ inputs.other-toolchain }}"

      - uses: actions/download-artifact@v4
        with:
          name: extract-linux-x86_64
          path: ${{ runner.temp }}/downloaded

      # **The whole e2e/ directory, not just micro.** `e2e/micro` requires
      # `../micro-dep` by path, so copying the one directory produces a package
      # that lake cannot resolve — and the first run of this job read that
      # failure as "the toolchain mismatch was refused" while the extractor had
      # never started. Both fixtures move together and both get the new pin.
      - name: A package pinning the other toolchain
        run: |
          cp -r e2e "$RUNNER_TEMP/other-e2e"
          rm -rf "$RUNNER_TEMP/other-e2e"/*/.lake
          for f in "$RUNNER_TEMP/other-e2e"/*/lean-toolchain; do
            echo "${{ inputs.other-toolchain }}" > "$f"
          done
          grep -r . "$RUNNER_TEMP/other-e2e"/*/lean-toolchain

      - name: Run the v4.31.0 extractor against it
        run: |
          chmod +x "$RUNNER_TEMP/downloaded/extract"
          tools/extractor-mismatch.sh \
            --extractor "$RUNNER_TEMP/downloaded/extract" \
            --package "$RUNNER_TEMP/other-e2e/micro" \
            --built-for "$(cat e2e/micro/lean-toolchain)" \
            --json "$RUNNER_TEMP/mismatch.json"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mismatch-json
          path: ${{ runner.temp }}/mismatch.json
          if-no-files-found: warn

  # ------------------------------------------------------------------- X6
  #
  # X4 moves the binary between runners that all have the same `/home/runner`
  # and the same `~/.elan`, so it cannot see a path baked in at build time —
  # and the Linux binary carries 17 strings starting with the builder's home.
  # A user downloading a release has neither. This job puts the toolchain
  # somewhere else entirely (ELAN_HOME) and runs the same binary there: if any
  # of those 17 paths is read at run time, this is where it shows.
  elsewhere:
    name: X6 — the toolchain somewhere else entirely
    needs: uniqueness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # `crates/litedoc4-render/build.rs` bundles the site's TypeScript into
      # `app.js`, so **cargo cannot build this workspace without node**
      # (`docs/plans/assets-typescript.md` 決定 1). Pinned rather than left to
      # whatever the runner image happens to ship: the version is the one in
      # `mise.toml`, and `tools/assets-gate.sh` checks that these two agree.
      - uses: actions/setup-node@v6
        with:
          node-version: "24.19.0"

      - name: elan in a non-default location
        run: |
          export ELAN_HOME="$RUNNER_TEMP/alt/elan"
          mkdir -p "$ELAN_HOME"
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          ELAN_HOME="$ELAN_HOME" ./elan-init -y --default-toolchain "$(cat e2e/micro/lean-toolchain)"
          echo "ELAN_HOME=$ELAN_HOME" >> "$GITHUB_ENV"
          echo "$ELAN_HOME/bin" >> "$GITHUB_PATH"
          # Proof it is not the default one: the default would be ~/.elan
          test ! -d "$HOME/.elan" || { echo "a default elan exists too — this job would not prove anything" >&2; exit 1; }

      - uses: actions/download-artifact@v4
        with:
          name: extract-linux-x86_64
          path: ${{ runner.temp }}/downloaded

      # `--expect any`: a clean run is the *good* outcome here (same toolchain,
      # different location), so success must not be reported as the failure the
      # mismatch job looks for. What is being tested is that it runs at all.
      - name: The same binary, a toolchain it has never seen the path of
        run: |
          chmod +x "$RUNNER_TEMP/downloaded/extract"
          ldd "$RUNNER_TEMP/downloaded/extract" || true
          tools/extractor-mismatch.sh \
            --extractor "$RUNNER_TEMP/downloaded/extract" \
            --package e2e/micro \
            --expect any \
            --json "$RUNNER_TEMP/elsewhere.json"
          cat "$RUNNER_TEMP/elsewhere.json"

      # Running is half of it. This is the other half: the IR it writes there
      # must be the IR the e2e gates expect, so the whole fixture is generated.
      - name: Install the toolchain rust-toolchain.toml asks for
        run: rustup show

      - name: Build the CLI
        run: cargo build --bin litedoc4

      # `LAKE` is explicit because e2e-micro.sh defaults to ~/.elan/bin/lake,
      # and the whole point of this job is that there is nothing in ~/.elan.
      # (That default is fine for the fixture's normal use; it just cannot be
      # left implicit here.)
      - name: End to end, with the toolchain in an unusual place
        run: |
          tools/e2e-micro.sh \
            --extractor "$RUNNER_TEMP/downloaded/extract" \
            --out "$RUNNER_TEMP/e2e" --keep
        env:
          LAKE: ${{ runner.temp }}/alt/elan/bin/lake
