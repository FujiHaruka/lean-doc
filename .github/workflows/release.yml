# Build the `litedoc4` binary for each platform, prove it works, and attach it
# to a GitHub release.  (docs/plans/distribution.md, D2)
#
# ============================================================================
# WHY ONLY THE RUST BINARY IS HERE
# ============================================================================
#   The Lean extractor is 171 MB against this binary's 2.5 MB, and building it
#   takes ~16 s against cargo's ~24 s 【実測】. Shipping the small one removes a
#   24 s build **and** a several-hundred-MB cargo cache from every user's CI;
#   shipping the large one would trade a 16 s build for a 46 MB download and a
#   matrix that multiplies by toolchain. Whether it can be shipped at all is a
#   separate measurement — .github/workflows/ci-extractor-portability.yml.
#
# ============================================================================
# WHAT IS IN THE ARCHIVE, AND WHY IT IS NOT JUST THE BINARY
# ============================================================================
#   `litedoc4` + `LICENSE` + `NOTICE`. A binary release is Apache-2.0 §4's
#   "Object form", which triggers (a): recipients get the licence text. And md4c
#   is compiled into the binary under MIT, whose permission notice must travel
#   with "all copies" — NOTICE used to *point* at vendor/md4c/LICENSE.md, which
#   is not in this archive, so the full text was moved into NOTICE on
#   2026-08-18. docs/provenance.md §4 is the record.
#
# ============================================================================
# WHY A SMOKE JOB THAT BUILDS A WHOLE SITE
# ============================================================================
#   `--version` proves the file is executable, not that it is correct: a musl
#   build with a broken md4c link would pass it and then produce documentation
#   with no rendered markdown. So the archive that will be uploaded is unpacked
#   on a clean runner and run through tools/e2e-micro.sh, which is the same
#   three gates CI uses (one command / idempotence / determinism).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "build and verify the archives without publishing"
        type: boolean
        default: true

concurrency:
  # Never cancelled: `publish` uploads release assets, and a run killed between
  # two uploads leaves a half-populated release behind.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The one that matters for the happy path: GitHub Actions runners.
          # musl so that the glibc version of the runner image stops being a
          # thing anyone has to think about.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          # NO x86_64-apple-darwin. It needs an Intel runner to be *tested* on,
          # and `macos-13` sat queued for over 15 minutes on 2026-08-18 without
          # ever starting. Cross-compiling it from the arm runner would produce
          # a binary nobody had executed — the same "it built, therefore it
          # works" this file's smoke job exists to refuse. Intel macOS builds
          # from source; README says so.
          #
          # Also absent: aarch64-unknown-linux-*. It needs a cross toolchain for
          # the vendored C, and there is no arm Linux runner here to test on.
    steps:
      - uses: actions/checkout@v5

      # `crates/litedoc4-render/build.rs` bundles the site's TypeScript into
      # `app.js`, so **cargo cannot build this workspace without node**
      # (`docs/plans/assets-typescript.md` 決定 1). Pinned rather than left to
      # whatever the runner image happens to ship: the version is the one in
      # `mise.toml`, and `tools/assets-gate.sh` checks that these two agree.
      - uses: actions/setup-node@v6
        with:
          node-version: "24.19.0"

      - name: Install the toolchain rust-toolchain.toml asks for
        run: |
          rustup show
          rustup target add ${{ matrix.target }}

      # cc-rs picks musl-gcc up from PATH, but only if it is there: without
      # this, vendored md4c is compiled by the host gcc and the link fails late,
      # after cargo has already spent minutes on the Rust half.
      - name: musl toolchain for the vendored C
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --bin litedoc4 --target ${{ matrix.target }}
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc

      # A musl target that came out dynamically linked is the failure this
      # whole choice of target exists to avoid, and it is invisible until it
      # runs on a machine with a different libc. Assert it here.
      - name: It is what it claims to be
        run: |
          BIN=target/${{ matrix.target }}/release/litedoc4
          ls -l "$BIN"
          file "$BIN"
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            # The test is "did ldd resolve any shared object", i.e. does its
            # output contain `=>`. **Not** the wording: a static binary makes
            # ldd say "not a dynamic executable" on some systems and
            # "statically linked" on others, and the first version of this
            # check failed the build over that difference rather than over
            # anything about the binary.
            if ldd "$BIN" 2>&1 | grep -q "=>"; then
              echo "::error::expected a static binary, but ldd resolved shared objects"
              ldd "$BIN" || true
              exit 1
            fi
            echo "statically linked — ldd resolved nothing:"
            ldd "$BIN" 2>&1 || true
          fi

      - name: Work out the version
        id: v
        shell: bash
        run: |
          # A tag is authoritative when there is one; otherwise the workspace
          # version, so a dry run produces the same names a release would.
          W="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then V="${GITHUB_REF_NAME#v}"
          else V="$W"; fi
          # **A tag that disagrees with the workspace version publishes an inert
          # release.** `lakefile.lean`'s `resolveLitedoc4` looks a binary up by
          # the version in the *required tree's* `Cargo.toml`, so assets under
          # any other number are a URL nobody asks for: the consumer announces
          # "no asset for this version" and falls through to `cargo build`.
          # Nothing breaks loudly, which is why this has to be checked here —
          # it is the same defect as shipping a v0.1.4 binary to a tree whose
          # extractor writes a newer IR schema, one step upstream
          # (docs/plans/feature-sweep.md §9).
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "$V" != "$W" ]; then
            echo "::error::tag v$V does not match [workspace.package] version $W in Cargo.toml." \
                 "The assets would publish under $V while every consumer asks for v$W," \
                 "so the release would be inert. Move the version, or move the tag." >&2
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # **The asset name carries no version.** That is what makes
          #   releases/latest/download/litedoc4-<target>.tar.gz
          # a URL that keeps working, which is the whole install instruction in
          # README. The version is inside, in the directory it unpacks to, so
          # two downloads still do not collide on disk.
          echo "asset=litedoc4-${{ matrix.target }}" >> "$GITHUB_OUTPUT"
          echo "dir=litedoc4-$V-${{ matrix.target }}" >> "$GITHUB_OUTPUT"

      - name: Archive
        shell: bash
        run: |
          DIR="${{ steps.v.outputs.dir }}"
          mkdir -p "dist/$DIR"
          cp "target/${{ matrix.target }}/release/litedoc4" "dist/$DIR/"
          cp LICENSE NOTICE "dist/$DIR/"
          tar -C dist -czf "dist/${{ steps.v.outputs.asset }}.tar.gz" "$DIR"
          rm -rf "dist/$DIR"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.v.outputs.asset }}
          path: dist/*.tar.gz
          retention-days: 7

  # --------------------------------------------------------------------------
  # The archive, on a runner that never built it, generating a real site.
  smoke:
    name: smoke — the Linux archive builds a site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: "*x86_64-unknown-linux-musl"
          path: ${{ runner.temp }}/dl
          merge-multiple: true

      - name: Unpack exactly what a user would download
        run: |
          cd "$RUNNER_TEMP/dl"
          ls -l
          tar xzf *.tar.gz
          find . -maxdepth 2 -type f | sort
          # The licence files are an obligation, not decoration: fail if the
          # archive ever stops carrying them.
          test -f */LICENSE || { echo "no LICENSE in the archive" >&2; exit 1; }
          test -f */NOTICE  || { echo "no NOTICE in the archive"  >&2; exit 1; }
          grep -q "Martin Mit" */NOTICE || { echo "NOTICE lost md4c's MIT text" >&2; exit 1; }

      - name: Cache elan
        id: elan-cache
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('e2e/micro/lean-toolchain') }}

      - name: Install elan at the fixture's toolchain
        if: steps.elan-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          ./elan-init -y --default-toolchain "$(cat e2e/micro/lean-toolchain)"

      - name: Put elan on PATH
        run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # LITEDOC4 points e2e-micro.sh at the unpacked binary instead of a cargo
      # build, so what is measured is the artifact, not this checkout.
      - name: End to end with the downloaded binary
        run: |
          BIN="$(find "$RUNNER_TEMP/dl" -name litedoc4 -type f | head -1)"
          chmod +x "$BIN"
          "$BIN" --version || true
          LITEDOC4="$BIN" tools/e2e-micro.sh --out "$RUNNER_TEMP/e2e" --keep

  # --------------------------------------------------------------------------
  publish:
    name: publish
    needs: [build, smoke]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/dl
          merge-multiple: true

      - name: Checksums
        run: |
          cd "$RUNNER_TEMP/dl"
          ls -l
          sha256sum *.tar.gz > checksums.txt
          cat checksums.txt

      # `--repo` on every call: this runs from $RUNNER_TEMP/dl, which is not a
      # git repository, and `gh` works out the repository from the checkout it
      # is standing in. Without it the step dies with "fatal: not a git
      # repository" after everything else has already succeeded.
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          cd "$RUNNER_TEMP/dl"
          if gh release view "$GITHUB_REF_NAME" --repo "$R" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./*.tar.gz checksums.txt --clobber --repo "$R"
          else
            gh release create "$GITHUB_REF_NAME" ./*.tar.gz checksums.txt \
              --title "$GITHUB_REF_NAME" --generate-notes --repo "$R"
          fi

      # "The command exited 0" is not "the assets are on the release". Ask.
      - name: The release actually carries the assets
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          set -euo pipefail
          NAMES="$(gh release view "$GITHUB_REF_NAME" --repo "$R" --json assets --jq '.assets[].name' | sort)"
          echo "$NAMES"
          for want in litedoc4-x86_64-unknown-linux-musl.tar.gz \
                      litedoc4-aarch64-apple-darwin.tar.gz \
                      checksums.txt; do
            echo "$NAMES" | grep -qx "$want" || { echo "::error::missing asset: $want"; exit 1; }
          done
