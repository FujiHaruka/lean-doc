# The green light. Everything here runs on a machine that has never seen the
# measurement target, and that is the point.
#
# WHAT "GREEN" MEANS NOW
#   Gate A (byte reproduction against doc-gen4) ended at M8, so the definition
#   of green fell back to `cargo test --workspace` (docs/implementation-plan.md
#   §1). This workflow is what makes that definition mechanical rather than a
#   sentence in a plan.
#
# WHAT IS DELIBERATELY NOT HERE
#   Anything needing Mathlib. The target package's import closure is several GB
#   and the second target is synthetic but still Mathlib-pinned, so both stay
#   manual gates (tools/target2-gate.sh, tools/corpus-gate.sh). A check that
#   cannot run on a fresh runner is a gate, not a test — the same line
#   `crates/litedoc4/tests/resident.rs` already draws.
#
# WHY THE CORPUS TESTS DO NOT SILENTLY VANISH HERE
#   They are `#[ignore]`d, not skipped, so `cargo test` reports them by count,
#   and `tools/corpus-gate.sh --verify-list` fails if that set drifts from the
#   list the gate knows about. A test that quietly stops running is the failure
#   this workflow exists to prevent.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded run tells us nothing we want to wait for, and it still holds
# slots against the 20-job concurrency limit while telling us nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental compilation is for a working tree that gets built over and
  # over. CI builds once from a restored cache and throws the machine away, so
  # the incremental state is never read back — it is only written, cached, and
  # restored. Locally it was 3.5 GB of a 7.2 GB `target/`, and the cargo cache
  # is what was pushing this repository to 98.8% of the 10 GiB limit.
  CARGO_INCREMENTAL: 0
  # A backtrace costs nothing here and turns "assertion failed" into a location.
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (no corpus, no Lean)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # `crates/litedoc4-render/build.rs` bundles the site's TypeScript into
      # `app.js`, so **cargo cannot build this workspace without node**
      # (`docs/plans/assets-typescript.md` 決定 1). Pinned rather than left to
      # whatever the runner image happens to ship: the version is the one in
      # `mise.toml`, and `tools/assets-gate.sh` checks that these two agree.
      - uses: actions/setup-node@v6
        with:
          node-version: "24.19.0"

      # Before the Rust half, and deliberately: this is thirty seconds against
      # cargo's ten minutes, and `cargo build` cannot even start if the
      # TypeScript does not bundle. The four stages inside fail separately, so a
      # red run says which of lint / types / tests / bundle broke.
      - name: Assets gate (the site's TypeScript)
        run: tools/assets-gate.sh --json "$RUNNER_TEMP/assets.json"

      # rust-toolchain.toml pins the channel and asks for rustfmt and clippy;
      # `rustup show` is what makes rustup act on it.
      - name: Install the toolchain rust-toolchain.toml asks for
        run: |
          rustup show
          rustc --version
          cargo --version

      # **No `restore-keys`, and the key names the job.** Both were wrong before,
      # in ways that only showed up in the numbers:
      #
      #   `restore-keys: cargo-<os>-` made this a ratchet. A new Cargo.lock
      #   restored the previous generation's `target/`, built on top of it, and
      #   saved the union — so the entry grew every time the lockfile moved:
      #   72 MB → 357 → 560 → 884 → 1208 → 1530 → 1854 → 2177 MB over three
      #   days, nine live generations, 8.47 GiB of the repository's 10 GiB cache
      #   limit. Restoring it cost 63 s in a job whose actual build was 14 s.
      #   Cutting the fallback means a lockfile change builds cold — cheap here,
      #   because Cargo.lock has 34 packages in it — and the entry then stays
      #   the size of one honest build.
      #
      #   The bare key was shared with `e2e-micro` (one binary) and with
      #   ci-template.yml (whose `target/` is at another path entirely). Only one
      #   of them could save it, and which one won decided what the others got
      #   back. Naming the job in the key is what stops that.
      #
      # `rust-toolchain.toml` joins the hash because a channel bump invalidates
      # every artifact in `target/` anyway; without it the stale entry is still
      # restored, still 2 GB, and still useless.
      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-v2-${{ runner.os }}-ci-test-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}

      - name: Format
        run: cargo fmt --all --check

      # Which lints are on is `[workspace.lints]` in the root Cargo.toml, not this
      # line — so a local `cargo check` says the same thing this job says. All
      # that happens here is the promotion to an error.
      #
      # `--all-targets` so that tests and benches are linted too: most of this
      # workspace's code by line count is tests.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # A `[`Foo`]` that no longer resolves is a doc comment that has drifted from
      # the code, and this repository's doc comments are where the reasoning
      # lives. Found 15 of them the first time it ran, two of which named types
      # that had been renamed.
      #
      # `--document-private-items` because nothing outside this repository
      # consumes these crates: the internal documentation is the documentation.
      # `private_intra_doc_links` is allowed for the same reason — a public item
      # pointing at a private one is normal here, not a mistake.
      - name: Rustdoc links
        run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings -A rustdoc::private_intra_doc_links

      # A dependency nobody imports is still a crate to compile and still an entry
      # in what `cargo deny` has to vouch for. `litedoc4` was declaring
      # `litedoc4-md` without using it.
      - uses: taiki-e/install-action@cargo-machete
      - name: Unused dependencies
        run: cargo machete

      # `--no-fail-fast`: one red crate must not hide the state of the others.
      - name: Test
        run: cargo test --workspace --no-fail-fast

      # The corpus tests are not run here — this asserts that the set of them is
      # exactly the set the gate script knows about, so neither side can drift.
      - name: Verify the corpus gate's inventory
        run: tools/corpus-gate.sh --verify-list

      # Apache-2.0 §4 went live when this repository went public (2026-08-16).
      # The obligations were paid before that; this is what keeps a refactor from
      # quietly deleting an attribution that is now legally load-bearing.
      - name: Provenance
        run: tools/provenance-gate.sh

  # The tree we pull in, as opposed to the attributions we wrote (which the test
  # job checks). Both became obligations rather than tidiness when the repository
  # went public on 2026-08-16 — see deny.toml.
  supply-chain:
    name: supply chain (licences, advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # The only job that runs a real Lean environment. It exists because every test
  # in the job above fakes the extractor, so nothing there checks the contract
  # between `extractor/Extract.lean` and the Rust side: change what the extractor
  # writes and the whole test job stays green. See e2e/README.md.
  e2e-micro:
    name: e2e (real extractor, no Mathlib)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # `crates/litedoc4-render/build.rs` bundles the site's TypeScript into
      # `app.js`, so **cargo cannot build this workspace without node**
      # (`docs/plans/assets-typescript.md` 決定 1). Pinned rather than left to
      # whatever the runner image happens to ship: the version is the one in
      # `mise.toml`, and `tools/assets-gate.sh` checks that these two agree.
      - uses: actions/setup-node@v6
        with:
          node-version: "24.19.0"

      - name: Install the toolchain rust-toolchain.toml asks for
        run: rustup show

      # Keyed per job and without `restore-keys` — see the note in `test`. This
      # job builds one binary; `test` builds --all-targets. Same key was wrong.
      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-v2-${{ runner.os }}-ci-e2e-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}

      # Lean core only. The fixture depends on nothing else, which is what keeps
      # this job to minutes instead of the gigabytes Mathlib would cost.
      - name: Cache elan
        id: elan-cache
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('e2e/micro/lean-toolchain') }}

      - name: Install elan at the fixture's toolchain
        if: steps.elan-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          ./elan-init -y --default-toolchain "$(cat e2e/micro/lean-toolchain)"

      - name: Put elan on PATH
        run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build the CLI
        run: cargo build --bin litedoc4

      # Builds the fixture, builds the extractor inside the fixture's own Lean
      # environment, generates a site, and checks the three gates: one command,
      # idempotence, determinism.
      - name: End to end
        run: tools/e2e-micro.sh --out "$RUNNER_TEMP/e2e" --keep

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # The runtime half. Static checks cannot see whether the module tree draws,
      # whether search returns anything, or whether 375 px still fits — and
      # ui-redesign.md left that last one recorded as 未判定 for exactly that
      # reason. ubuntu-latest ships Chrome, so nothing is downloaded to drive it.
      - name: Browser gate
        run: tools/browser-gate.sh "$RUNNER_TEMP/e2e/first/site" --json "$RUNNER_TEMP/browser.json"
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: Upload the generated site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-micro-site
          path: ${{ runner.temp }}/e2e/first/site
          if-no-files-found: warn
